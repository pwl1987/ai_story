# AI Story - nginx 开发环境配置
# 反向代理配置，统一入口

# 上游服务器定义
upstream django_admin {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream daphne_asgi {
    server 127.0.0.1:8010;
    keepalive 32;
}

upstream frontend_dev {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP 服务器配置
server {
    listen 80;
    server_name localhost ai-story.local;

    # 日志配置
    access_log /var/log/nginx/ai-story-access.log;
    error_log /var/log/nginx/ai-story-error.log;

    # 客户端上传大小限制
    client_max_body_size 100M;

    # 静态文件服务（最高优先级）
    location /static/ {
        alias /home/code/ai_story/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 媒体文件服务
    location /media/ {
        alias /home/code/ai_story/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Storage 文件服务（生成的图片、视频等）
    location /storage/ {
        alias /home/code/ai_story/storage/;
        expires 30d;
        add_header Cache-Control "public";
        autoindex off;
    }

    # Django Admin 后台
    location /admin/ {
        proxy_pass http://django_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API 端点
    location /api/ {
        proxy_pass http://daphne_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 超时设置（可能需要较长超时用于长时间请求）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket 连接
    location /ws/ {
        proxy_pass http://daphne_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 特定配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（WebSocket 需要长连接）
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # API 文档
    location /api/schema/ {
        proxy_pass http://daphne_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查端点
    location /api/v1/health/ {
        proxy_pass http://daphne_asgi;
        proxy_set_header Host $host;
        access_log off;
    }

    # 前端应用（开发模式 - Vue Dev Server）
    location / {
        proxy_pass http://frontend_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 热重载支持（仅开发环境）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 开发服务器超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error": "Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
