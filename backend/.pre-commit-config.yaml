# Pre-commit配置
# 仅包含Ruff代码质量检查和Pytest测试

repos:
  # Ruff: 超快的Python linter（替代flake8、pylint等）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      # 运行Ruff检查
      - id: ruff
        name: Ruff代码质量检查
        args: [--fix, --exit-non-zero-on-fix]
      # 运行Ruff格式化
      - id: ruff-format
        name: Ruff代码格式化

  # Pytest: 运行测试套件
  - repo: local
    hooks:
      - id: pytest
        name: Pytest测试套件
        entry: uv run pytest -v
        language: system
        pass_filenames: false
        always_run: true
