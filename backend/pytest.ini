[pytest]
# pytest配置文件
# 用于AI Story生成系统后端测试

# 测试路径
testpaths = tests

# Python测试文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Django配置
DJANGO_SETTINGS_MODULE = config.settings.development
django_find_project = true
# 添加项目根目录到Python路径
pythonpath = .

# 添加命令行选项
addopts =
    # 显示测试执行详细信息
    -v
    # 显示本地变量（帮助调试）
    -l
    # 显示测试持续时间
    --durations=10
    # 严格标记模式
    --strict-markers

# 测试标记
markers =
    django_db: 标记需要数据库的测试
    slow: 标记运行较慢的测试
    integration: 标记集成测试
    unit: 标记单元测试
    asyncio: 标记异步测试

# asyncio配置
asyncio_mode = auto

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 最小Python版本
minversion = 8.0

# 警告过滤
filterwarnings =
    # 忽略Django 5.2的弃用警告
    ignore::django.utils.deprecation.RemovedInDjango60Warning
    ignore::django.utils.deprecation.RemovedInDjango61Warning
    ignore::PendingDeprecationWarning
