# Ruff配置文件
# 目标Python版本
target-version = "py39"

# 行长度
line-length = 100

# 扫描的文件
include = ["*.py", "*.pyi"]

# 排除的目录
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    "migrations",
    "media",
    "static",
]

[lint]
# 启用的规则集
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]

# 忽略的规则
ignore = [
    "E501",   # 行太长（已在line-length配置）
    "E203",   # whitespace before ':' (与Black冲突)
    "B008",   # do not perform function calls in argument defaults (Django常用模式)
    "N806",   # variable in function should be lowercase (Django模型字段大写约定)
    "UP035",  # deprecated import (Django兼容性)
    "SIM108", # use ternary operator (可能影响可读性)
    "RUF001", # ambiguous-unicode-character-string (中文项目)
    "RUF002", # ambiguous-unicode-character-docstring (中文项目)
    "RUF003", # ambiguous-unicode-character-comment (中文项目)
    "RUF012", # mutable-class-default (Django Admin常见模式)
    "UP006",  # non-pep585-annotation (Python 3.9兼容性)
    "RUF013", # implicit-optional (可选类型声明)
]

# 每个文件允许的未使用导入（已清空以允许修复F401）
unfixable = []

[lint.per-file-ignores]
# 测试文件允许更多灵活性
"tests/**/*" = ["S101", "ARG", "PLR2004"]
# migrations文件通常有很多问题
"**/migrations/*" = ["ALL"]

[format]
# 使用双引号
quote-style = "double"

# 缩进风格
indent-style = "space"

# 保留魔法尾随逗号
skip-magic-trailing-comma = false

# 行尾
line-ending = "auto"

[lint.isort]
# isort配置
known-first-party = ["apps", "core", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
