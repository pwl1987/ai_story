# AI Story - Docker Compose 生产环境配置
# 版本: 3.8
# 描述: 完整的容器化部署配置，包含所有服务
#
# 架构:
# - frontend: Nginx + Vue静态文件
# - backend: Django ASGI (支持WebSocket)
# - celery_worker: Celery异步任务处理器
# - celery_beat: Celery定时任务调度器
# - redis: Redis (缓存 + Pub/Sub + Celery broker)
# - postgres: PostgreSQL数据库
#
# 使用方法:
#   docker-compose -f docker-compose.prod.yml up -d
#
# 环境变量:
#   请先创建 .env 文件并配置必要的环境变量

services:
  # ============================================
  # PostgreSQL 数据库
  # ============================================
  postgres:
    image: postgres:14-alpine
    container_name: ai_story_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_story}
      POSTGRES_USER: ${POSTGRES_USER:-ai_story}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_story}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_story_network

  # ============================================
  # Redis (缓存 + Pub/Sub + Celery Broker)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ai_story_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai_story_network

  # ============================================
  # Django Backend (ASGI - 支持WebSocket)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        - PYTHON_VERSION=3.10
    container_name: ai_story_backend
    restart: unless-stopped
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class uvicorn.workers.UvicornWorker --worker-connections 1000 --timeout 300 --keep-alive 5 --access-logfile - --error-logfile - --log-level info
    environment:
      # Django配置
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # 数据库配置
      POSTGRES_DB: ${POSTGRES_DB:-ai_story}
      POSTGRES_USER: ${POSTGRES_USER:-ai_story}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      # Celery配置
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      # AI服务配置
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 媒体存储
      STORAGE_ROOT: /app/media
      # CORS配置
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - ./backend/logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai_story_network

  # ============================================
  # Celery Worker (异步任务处理)
  # ============================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ai_story_celery_worker
    restart: unless-stopped
    command: celery -A config worker -Q llm,image,video -l info --concurrency=4 --max-tasks-per-child=100
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      # 数据库配置
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ai_story}
      POSTGRES_USER: ${POSTGRES_USER:-ai_story}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Redis配置
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      # AI服务配置
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - backend_media:/app/media
      - ./backend/logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - ai_story_network

  # ============================================
  # Celery Beat (定时任务调度)
  # ============================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ai_story_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - ai_story_network

  # ============================================
  # Nginx (前端静态文件 + 反向代理)
  # ============================================
  frontend:
    image: nginx:alpine
    container_name: ai_story_frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - backend_static:/usr/share/nginx/html/static:ro
      - backend_media:/usr/share/nginx/html/media:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    networks:
      - ai_story_network

# ============================================
# 网络配置
# ============================================
networks:
  ai_story_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# 数据卷配置
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local
